<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusFind — Report Item</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html">Campus<span>Find</span></a>
      <button class="menu-toggle" type="button">Menu</button>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="items.html">Browse Items</a>
        <a class="active" href="report.html">Report Item</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="admin.html">Admin</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top: 28px;">
    <h1>Report an item</h1>
    <p class="meta">Login required to submit. Images are uploaded to the server.</p>
    <div class="form-card">
      <form id="report-form" novalidate>
        <div class="form-group">
          <label for="type">Lost or Found</label>
          <select id="type">
            <option value="">Select type</option>
            <option value="LOST">Lost</option>
            <option value="FOUND">Found</option>
          </select>
          <p class="error" id="type-error"></p>
        </div>
        <div class="form-group">
          <label for="title">Item name</label>
          <input id="title" type="text" placeholder="Black Wallet">
          <p class="error" id="title-error"></p>
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="">Select category</option>
            <option>Personal</option>
            <option>Electronics</option>
            <option>Documents</option>
            <option>Bags</option>
            <option>Stationery</option>
          </select>
          <p class="error" id="category-error"></p>
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="4" placeholder="Color, brand, where it was last seen"></textarea>
          <p class="error" id="description-error"></p>
        </div>
        <div class="form-group">
          <label for="location">Location</label>
          <input id="location" type="text" placeholder="Library">
          <p class="error" id="location-error"></p>
        </div>
        <div class="form-group">
          <label for="date">Date</label>
          <input id="date" type="date">
          <p class="error" id="date-error"></p>
        </div>
        <div class="form-group">
          <label for="image">Image (optional)</label>
          <input id="image" type="file" accept="image/*">
          <div id="image-preview" style="margin-top: 8px; display: none;">
            <img id="preview-img" src="" alt="Preview" style="max-width: 200px; max-height: 200px; border-radius: 8px;">
            <button type="button" id="remove-image" class="btn btn-light" style="margin-top: 8px; padding: 4px 8px; font-size: 0.85rem;">Remove</button>
          </div>
          <p class="error" id="image-error"></p>
        </div>
        <div class="form-group">
          <label for="handover_method">Handover method (optional)</label>
          <select id="handover_method">
            <option value="">Select handover method</option>
            <option value="in_person">In person</option>
            <option value="mail">Mail/Post</option>
            <option value="locker">Locker pickup</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="handover_note">Handover note (optional)</label>
          <textarea id="handover_note" rows="2" placeholder="E.g., Available after 3pm at front desk"></textarea>
        </div>
        <p class="error" id="report-error"></p>
        <button class="btn btn-gold" type="submit">Submit report</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">CampusFind · Campus Lost & Found</div>
  </footer>
  <script src="js/app.js"></script>
</body>
</html>
