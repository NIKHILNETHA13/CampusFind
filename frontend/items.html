<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusFind — Browse Items</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html">Campus<span>Find</span></a>
      <button class="menu-toggle" type="button">Menu</button>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a class="active" href="items.html">Browse Items</a>
        <a href="report.html">Report Item</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="admin.html">Admin</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top: 28px;">
    <h1>Browse Items</h1>
    <p class="meta">Search and filter sample lost and found reports.</p>
    <div class="filters">
      <input id="search-input" type="search" placeholder="Search by name, location, or description">
      <select id="category-filter">
        <option value="">All categories</option>
        <option>Personal</option>
        <option>Electronics</option>
        <option>Documents</option>
        <option>Bags</option>
        <option>Stationery</option>
      </select>
      <select id="type-filter">
        <option value="">Lost & Found</option>
        <option value="LOST">Lost</option>
        <option value="FOUND">Found</option>
      </select>
    </div>
    <div class="item-grid" id="items-grid"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">CampusFind · Campus Lost & Found</div>
  </footer>
  <script src="js/app.js"></script>
</body>
</html>
