<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusFind — Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html">Campus<span>Find</span></a>
      <button class="menu-toggle" type="button">Menu</button>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="items.html">Browse Items</a>
        <a href="report.html">Report Item</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="admin.html">Admin</a>
        <a class="active" href="login.html">Login</a>
        <a href="register.html">Register</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="form-card auth-wrap">
      <h1>Login</h1>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="student@campus.edu">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password">
        </div>
        <p class="error" id="login-error"></p>
        <button class="btn btn-gold" type="submit">Login</button>
      </form>
      <p class="meta">New here? <a href="register.html">Register</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">CampusFind · Campus Lost & Found</div>
  </footer>
  <script src="js/app.js"></script>
</body>
</html>
