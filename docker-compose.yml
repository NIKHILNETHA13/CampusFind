
volumes:
  postgres_data:
  uploads_data:
  frontend_build:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-campusfind}
      POSTGRES_USER: ${DB_USER:-campususer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campuspass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    # Port 5432 NOT exposed to host for security
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-campususer} -d ${DB_NAME:-campusfind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-campususer}:${DB_PASSWORD:-campuspass}@db:5432/${DB_NAME:-campusfind}
      SECRET_KEY: ${SECRET_KEY:-changeme_in_production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      UPLOAD_DIR: /app/backend/uploads
      ADMIN_INVITE_CODE: ${ADMIN_INVITE_CODE:-campusfind-admin-2024}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER}
    volumes:
      - uploads_data:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
  adminer:
    image: adminer
    restart: unless-stopped
    depends_on:
      - db
